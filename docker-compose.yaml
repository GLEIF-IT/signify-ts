x-healthcheck: &healthcheck
    interval: 2s
    timeout: 3s
    retries: 5
    start_period: 2s

x-python-env: &python-env
    PYTHONUNBUFFERED: 1
    PYTHONIOENCODING: UTF-8

services:
    vlei-server:
        image: gleif/vlei:1.0.7@sha256:d42bffb148f531b99f8817e17723cbf21bdf6c357a69de63895078ae8b42601c
        environment:
            <<: *python-env
        command: vLEI-server -s ./schema/acdc -c ./samples/acdc/ -o ./samples/oobis/
        healthcheck:
            test: curl -f http://localhost:7723/oobi/EBfdlu8R27Fbx-ehrqwImnK-8Cm79sqbAQ4MmvEAYqao
            <<: *healthcheck
        ports:
            - 7723:7723

    keria:
        image: ${KERIA_IMAGE:-gleif/keria}:${KERIA_IMAGE_TAG:-0.4.6}
        environment:
            KERI_AGENT_CORS: 1
            <<: *python-env
        volumes:
            - ./config/keria.json:/keria/config/keri/cf/keria.json
        command: start --config-dir /keria/config --config-file keria --name agent
        healthcheck:
            test: wget --spider http://keria:3902/spec.yaml
            <<: *healthcheck
        ports:
            - 3901:3901
            - 3902:3902
            - 3903:3903

    witness-demo:
        image: gleif/keri:1.2.19@sha256:a46ecb85e6210f8340465d7423195cad2a550cdff83e0dfdfa50b07062bc5e76
        entrypoint: ['kli', 'witness', 'demo']
        environment:
            <<: *python-env
        healthcheck:
            test: wget --spider http://witness-demo:5642/oobi
            <<: *healthcheck
        volumes:
            - ./config/witness-demo:/keripy/scripts/keri/cf/main
        ports:
            - 5642:5642
            - 5643:5643
            - 5644:5644
